name: Keep Alive

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://fishvision-demo.streamlit.app/)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "App is awake"
          else
            echo "Got status $STATUS — app may be waking up"
          fi
