name: Keep Alive
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: playwright install chromium --with-deps
      - run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto("https://fishvision-demo.streamlit.app/", timeout=60000)
              try:
                  btn = page.get_by_text("Yes, get this app back up!")
                  if btn.is_visible():
                      print("App sleeping — clicking wake button")
                      btn.click()
                      page.wait_for_timeout(90000)
                  else:
                      print("App already awake")
              except Exception as e:
                  print("No sleep button found, app may already be up:", e)
              print("Title:", page.title())
              browser.close()
          EOF
