name: Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FishVision demo
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://fishvision-demo.streamlit.app/ || true
          echo "Pinged fishvision-demo.streamlit.app"
