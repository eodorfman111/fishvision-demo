name: Keep Alive
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: playwright install chromium --with-deps
      - run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto("https://fishvision-demo.streamlit.app/", timeout=60000, wait_until="domcontentloaded")
              frame = page.frame_locator("iframe[src*='fishvision-demo.streamlit.app']")
              btn = frame.locator("text=Yes, get this app back up!")
              try:
                  btn.first.wait_for(state="visible", timeout=15000)
                  print("App sleeping — clicking wake button")
                  btn.first.click()
                  page.wait_for_timeout(90000)
              except PWTimeout:
                  print("App already awake")
              print("Done")
              browser.close()
          EOF
