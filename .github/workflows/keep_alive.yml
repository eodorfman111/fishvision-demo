name: Keep Alive
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g playwright
      - run: npx playwright install chromium --with-deps
      - run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            await p.goto('https://fishvision-demo.streamlit.app/', { waitUntil: 'networkidle', timeout: 120000 });
            console.log('Done:', await p.title());
            await b.close();
          })();
          "
